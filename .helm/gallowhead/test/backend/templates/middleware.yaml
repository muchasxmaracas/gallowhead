apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: gallowhead-cors
  namespace: default
spec:
  headers:
    accessControlAllowOriginList:
      - "https://test.gallowhead.com"
      - "https://gallowhead.com"
      - "http://localhost:4200"
    accessControlAllowMethods:
      - GET
      - POST
      - OPTIONS
    accessControlAllowHeaders:
      - Authorization
      - Content-Type
    accessControlAllowCredentials: true
