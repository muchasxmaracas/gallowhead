apiVersion: v1
kind: Service
metadata:
  name: gallowhead-backend
  labels:
    {{- include "gallowhead.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "gallowhead.selectorLabels" . | nindent 4 }}
