server {
    listen 80;
    server_name test.gallowhead.com www.test.gallowhead.com;

    gzip on;
    gzip_http_version 1.1;
    gzip_disable "MSIE [1-6]\.";
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level 9;
    client_max_body_size 5M;
    proxy_read_timeout 200s;

    root /usr/share/nginx/html/browser;
    index index.html;

    # Place the API proxy location block FIRST
    location /api/ {
        proxy_pass http://gallowhead-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve Angular Frontend
    location / {
        try_files $uri /index.html;
    }

    # Angular Routes
    location /dates { try_files $uri /index.html; }
    location /band { try_files $uri /index.html; }
    location /media { try_files $uri /index.html; }
    location /tech { try_files $uri /index.html; }

    location /assets/ {
        expires 1M;
        access_log off;
    }

    # Basic Nginx Health Check (Internal)
    location /healthcheck {
        access_log off;
        add_header 'Content-Type' 'text/plain';
        return 200 "Healthy\n";
    }
}

server {
    listen 80;
    server_name test.api.gallowhead.com www.test.api.gallowhead.com;

    location / {
        proxy_pass http://gallowhead-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
