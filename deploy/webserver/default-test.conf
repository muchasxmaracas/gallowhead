server {
    listen 80;
    server_name test.gallowhead.com www.test.gallowhead.com;

    gzip on;
    gzip_http_version 1.1;
    gzip_disable "MSIE [1-6]\.";
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level 9;
    client_max_body_size 5M;
    proxy_read_timeout 200s;

    root /usr/share/nginx/html/browser;
    index index.html;

    # Serve Angular Frontend
    location / {
        try_files $uri /index.html;
    }

    # Angular Routes
    location /dates { try_files $uri /index.html; }
    location /band { try_files $uri /index.html; }
    location /media { try_files $uri /index.html; }
    location /tech { try_files $uri /index.html; }

    location /assets/ {
        expires 1M;
        access_log off;
    }

    # ✅ Proxy API requests to the Kubernetes service
    location /api/ {
        proxy_pass http://gallowhead-backend:3000;  # Internal K8s service name
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS Headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

        # Allow preflight OPTIONS requests
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ✅ Health Check Proxy (Ensuring /api/health works)
    location /api/health {
        proxy_pass http://gallowhead-backend:3000/api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS Headers (if needed)
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
    }

    # Basic Nginx Health Check (Internal)
    location /healthcheck {
        access_log off;
        add_header 'Content-Type' 'text/plain';
        return 200 "Healthy\n";
    }
}
