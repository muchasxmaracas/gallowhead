name: Docker Image Build Test

on:
  push:
    branches:
      - '*/*'
      - 'test'
      - '!main'
  pull_request:
    branches:
      - '*/*'
      - 'test'
      - '!main'

jobs:
  build-test-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build the frontend Docker image
      run: docker build . --file test.frontend.Dockerfile --tag gallowhead:test-frontend-$(date +%s)

  build-test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build the backend Docker image
      run: docker build . --file test.backend.Dockerfile --tag gallowhead:test-backend-$(date +%s)
